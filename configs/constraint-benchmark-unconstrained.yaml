categories: {max_depth: 5, max_slashes: 4, max_arity: 3}
parser: {beam_width: 64, max_stack_depth: 12, max_states_per_position: 1024, max_reductions_per_shift: 8, parse_count_cap: 10000}
grammar: {beam_width: 8, max_repairs_per_failure: 16, max_joint_repair_width: 2}
rules:
  allow_forward_application: true
  allow_backward_application: true
  allow_forward_composition: true
  allow_backward_composition: true
  allow_crossed_composition: false
  allow_generalized_composition: false
  max_composition_degree: 2
  # lightblue's non-combinatory rules for its CONJ, PERIOD and PUNCT categories.
  allow_coordination: true
  allow_period_absorption: true
  allow_punctuation_absorption: true
  # ASP: (X\A)/B <=> (X/B)\A, tried only after Application and Composition fail, at most once per constituent.
  allow_argument_swap: false
candidate_constraints: {enabled: false}
training: {seed: 42, compression_interval: 100, unresolved_policy: queue}
